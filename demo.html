<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Color Filter Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
  #colorButtons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .colorBtn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #ccc;
    cursor: pointer; font-size: 14px; background: #fff;
  }
  .colorBtn.active { border-color: #333; font-weight: 600; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .card { border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; }
  .swatch { width: 100%; height: 60px; border-radius: 6px; margin-bottom: 8px; }
  .modelName { font-size: 13px; font-weight: 600; }
  .variantName { font-size: 12px; color: #666; }
  #count { color: #666; margin-bottom: 10px; font-size: 14px; }
</style>
</head>
<body>

<h2>Color Filter Demo</h2>
<div id="colorButtons"></div>
<div id="count"></div>
<div id="results"></div>

<script src="data.updated.js"></script>
<script src="colorFilter.js"></script>
<script>
  const buttonsEl = document.getElementById('colorButtons');
  const resultsEl = document.getElementById('results');
  const countEl = document.getElementById('count');

  // Build filter buttons from FILTER_OPTIONS
  let activeColor = null;
  FILTER_OPTIONS.colorTag.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'colorBtn';
    btn.textContent = opt.label;
    btn.onclick = () => {
      activeColor = (activeColor === opt.value) ? null : opt.value;
      render();
    };
    btn.dataset.value = opt.value;
    buttonsEl.appendChild(btn);
  });

  function render() {
    // update active button styling
    [...buttonsEl.children].forEach(b => {
      b.classList.toggle('active', b.dataset.value === activeColor);
    });

    if (!activeColor) {
      resultsEl.innerHTML = '';
      countEl.textContent = 'Select a color to filter.';
      return;
    }

    const matches = getVariantsByColor(activeColor);
    countEl.textContent = `${matches.length} variant(s) tagged "${activeColor}"`;

    resultsEl.innerHTML = matches.map(({ model, variant }) => `
      <div class="card">
        <div class="swatch" style="background:${variant.color}"></div>
        <div class="modelName">${model.name || model.id}</div>
        <div class="variantName">${variant.name}</div>
      </div>
    `).join('');
  }

  render();
</script>
</body>
</html>
