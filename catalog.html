<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog — Block Party</title>
  <meta name="description" content="Browse all Minecraft CIT furniture models. Filter by room, color, and category." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-mark"><span></span><span></span><span></span><span></span></div>
    Block Party
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="catalog.html">Catalog</a>
    <a class="nav-link" href="guide.html">How it works</a>
    <a class="nav-link" href="faq.html">FAQ</a>
  </div>
  <div class="nav-spacer"></div>
  <a class="cart-btn" href="cart.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    Your pack <span class="cart-badge">0</span>
  </a>
</nav>

<div class="catalog-layout">

  <!-- SIDEBAR FILTERS -->
  <aside class="filter-sidebar">
    <div class="filter-sidebar-title">Filter</div>
    <div class="filter-group">
      <div class="filter-group-label">Category</div>
      <div id="filter-category"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-label">Room</div>
      <div id="filter-room"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-label">Color</div>
      <div id="filter-color"></div>
    </div>
    <button class="filter-clear" id="clear-filters" style="display:none">✕ Clear all filters</button>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="catalog-main">
    <div class="catalog-topbar">
      <div class="catalog-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search by name, base item, or code…" />
      </div>
      <div class="catalog-count" id="catalog-count">Loading…</div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="model-grid" id="catalog-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-state-icon">🔍</div>
      <h3>No models found</h3>
      <p>Try clearing some filters or searching for something else.</p>
    </div>
  </div>

</div>

<!-- QUICK ADD POPUP -->
<div class="quickadd-overlay" id="quickadd-overlay" onclick="closeQuickAdd(event)">
  <div class="quickadd-panel" id="quickadd-panel">
    <div class="quickadd-header">
      <div class="quickadd-thumb"><img id="qa-thumb" src="" alt=""></div>
      <div>
        <div class="quickadd-title" id="qa-title"></div>
        <div class="quickadd-sub" id="qa-sub"></div>
      </div>
      <button class="quickadd-close" onclick="closeQuickAdd()">✕</button>
    </div>
    <div class="quickadd-body">
      <div class="quickadd-preview">
        <img id="qa-preview" src="" alt="">
      </div>

      <div class="quickadd-section-label">
        Color variants
        <button class="quickadd-select-all" onclick="qaSelectAll('variants')">Select all</button>
      </div>
      <div class="quickadd-swatches" id="qa-swatches"></div>

      <div class="quickadd-section-label">
        Block placements
        <button class="quickadd-select-all" onclick="qaSelectAll('positions')">Select all</button>
      </div>
      <div class="quickadd-placements" id="qa-placements"></div>
    </div>
    <div class="quickadd-footer">
      <button class="quickadd-add-btn" id="qa-add-btn" onclick="doQuickAdd()" disabled>Add to pack</button>
      <button class="quickadd-view-btn" id="qa-view-btn">View full page →</button>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-logo">Block Party</div>
  <p>Free Minecraft CIT resource packs. <a href="faq.html">FAQ</a> · <a href="guide.html">How it works</a></p>
</footer>

<script src="data.js"></script>
<script src="colorFilter.js"></script>
<script src="cart.js"></script>
<script>
  // ---------- Filters ----------
  const activeFilters = { category: [], room: [], color: [] };
  let searchQuery = '';

  function buildFilters() {
    Object.entries(FILTER_OPTIONS).forEach(([type, options]) => {
      const container = document.getElementById(`filter-${type}`);
      if (!container) return;
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'filter-option';
        btn.dataset.type = type;
        btn.dataset.value = opt.value;
        btn.innerHTML = `<div class="filter-check"><span class="filter-check-mark">✓</span></div>${opt.label}`;
        btn.addEventListener('click', () => toggleFilter(type, opt.value, btn));
        container.appendChild(btn);
      });
    });
  }

  function toggleFilter(type, value, btn) {
    const idx = activeFilters[type].indexOf(value);
    if (idx >= 0) { activeFilters[type].splice(idx, 1); btn.classList.remove('active'); }
    else { activeFilters[type].push(value); btn.classList.add('active'); }
    renderActiveFilterPills();
    renderGrid();
  }

  function clearAllFilters() {
    Object.keys(activeFilters).forEach(k => activeFilters[k] = []);
    document.querySelectorAll('.filter-option').forEach(b => b.classList.remove('active'));
    renderActiveFilterPills();
    renderGrid();
  }

  function renderActiveFilterPills() {
    const container = document.getElementById('active-filters');
    container.innerHTML = '';
    let any = false;
    Object.entries(activeFilters).forEach(([type, vals]) => {
      vals.forEach(val => {
        any = true;
        const opt = FILTER_OPTIONS[type]?.find(o => o.value === val);
        const pill = document.createElement('button');
        pill.className = 'active-filter-pill';
        pill.innerHTML = `${opt?.label || val} ✕`;
        pill.addEventListener('click', () => {
          activeFilters[type] = activeFilters[type].filter(v => v !== val);
          document.querySelectorAll(`.filter-option[data-type="${type}"][data-value="${val}"]`).forEach(b => b.classList.remove('active'));
          renderActiveFilterPills(); renderGrid();
        });
        container.appendChild(pill);
      });
    });
    document.getElementById('clear-filters').style.display = any ? '' : 'none';
  }

  function getFilteredModels() {
    const searchColor = resolveColorFromQuery(searchQuery);
    return MODELS.filter(model => {
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const textMatch = model.name.toLowerCase().includes(q) ||
          model.description.toLowerCase().includes(q) ||
          model.baseItem.toLowerCase().includes(q) ||
          model.anvilCode.toLowerCase().includes(q) ||
          model.tags.some(t => t.includes(q));
        // If the search term is a recognized color (e.g. "pink"), also match
        // any model that has at least one variant tagged with that color.
        const colorMatch = searchColor && model.variants.some(v => (v.colorTags || []).includes(searchColor));
        if (!textMatch && !colorMatch) return false;
      }
      if (activeFilters.category.length && !activeFilters.category.includes(model.category)) return false;
      if (activeFilters.room.length && !activeFilters.room.some(r => model.room.includes(r))) return false;
      if (activeFilters.color.length && !activeFilters.color.some(c => model.variants.some(v => (v.colorTags || []).includes(c)))) return false;
      return true;
    });
  }

  // ---------- Grid ----------
  function getImgSrc(model, variantCode) {
    const file = model.images?.[variantCode] || (variantCode + '.png');
    return `images/${model.id}/${file}`;
  }

  // Colors currently in play, from either the sidebar filter or the search box
  function getEffectiveColors() {
    const colors = [...activeFilters.color];
    const searchColor = resolveColorFromQuery(searchQuery);
    if (searchColor && !colors.includes(searchColor)) colors.push(searchColor);
    return colors;
  }

  // Pick the variant to show as the model's cover image: first a variant
  // matching an active color (filter or search), else the model's manually
  // set defaultVariant, else the first variant.
  function getBestVariant(model) {
    return getDefaultVariant(model, getEffectiveColors());
  }

  function renderGrid() {
    const grid = document.getElementById('catalog-grid');
    const empty = document.getElementById('empty-state');
    const count = document.getElementById('catalog-count');
    const models = getFilteredModels();

    count.textContent = `${models.length} model${models.length !== 1 ? 's' : ''}`;
    grid.innerHTML = '';
    if (models.length === 0) { grid.style.display = 'none'; empty.style.display = ''; return; }
    grid.style.display = ''; empty.style.display = 'none';

    models.forEach(model => {
      const activeVariant = getBestVariant(model);
      const imgSrc = getImgSrc(model, activeVariant.code);

      // Color dots with hover-to-preview
      const dots = model.variants.slice(0, 12).map(v =>
        `<div class="color-dot"
          style="background:${v.color};${v.code === activeVariant.code ? 'outline:2px solid var(--ink-mid);outline-offset:1px;' : ''}"
          title="${v.name}"
          data-img="${getImgSrc(model, v.code)}"
          onmouseenter="previewVariant(this, '${model.id}')"
          onmouseleave="resetPreview('${model.id}', '${imgSrc}')">
        </div>`
      ).join('');

      const card = document.createElement('div');
      card.className = 'model-card';
      card.dataset.modelId = model.id;
      card.innerHTML = `
        <div class="model-thumb">
          <img id="thumb-${model.id}" src="${imgSrc}" alt="${model.name}" onerror="this.style.opacity='0.2'">
          <button class="quick-add-btn" title="Quick select">+ Quick add</button>
        </div>
        <div class="model-info">
          <div class="model-collection" style="display:flex;justify-content:space-between;align-items:center">
            <span>${model.baseItem}</span>
            <span style="font-family:monospace;font-size:10px;background:var(--parchment2);padding:1px 6px;border-radius:4px;color:var(--terra-dark);letter-spacing:0">${model.anvilCode}</span>
          </div>
          <div class="model-name">${model.name}</div>
          <div class="model-meta">${model.variants.length} colors · ${model.positions.length} placement${model.positions.length !== 1 ? 's' : ''}</div>
          <div class="color-dots">${dots}</div>
        </div>`;

      card.querySelector('.quick-add-btn').addEventListener('click', e => {
        e.stopPropagation();
        openQuickAdd(model.id);
      });
      card.addEventListener('click', () => location.href = `model.html?id=${model.id}`);
      grid.appendChild(card);
    });
  }

  // ---------- Hover preview ----------
  function previewVariant(dot, modelId) {
    const img = document.getElementById(`thumb-${modelId}`);
    if (img) img.src = dot.dataset.img;
  }
  function resetPreview(modelId, originalSrc) {
    const img = document.getElementById(`thumb-${modelId}`);
    if (img) img.src = originalSrc;
  }

  // ---------- Quick Add Popup ----------
  let qaModel = null;
  let qaSelectedVariants = [];
  let qaSelectedPositions = [];

  function openQuickAdd(modelId) {
    qaModel = MODELS.find(m => m.id === modelId);
    if (!qaModel) return;
    qaSelectedVariants = [];
    qaSelectedPositions = [];

    const openVariant = getBestVariant(qaModel);
    document.getElementById('qa-title').textContent = qaModel.name;
    document.getElementById('qa-sub').textContent = `${qaModel.baseItem} · ${qaModel.anvilCode}`;
    document.getElementById('qa-thumb').src = getImgSrc(qaModel, openVariant.code);
    document.getElementById('qa-preview').src = getImgSrc(qaModel, openVariant.code);
    document.getElementById('qa-view-btn').onclick = () => location.href = `model.html?id=${qaModel.id}`;

    renderQASwatches();
    renderQAPlacements();
    updateQABtn();

    document.getElementById('quickadd-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeQuickAdd(e) {
    if (e && e.target !== document.getElementById('quickadd-overlay')) return;
    document.getElementById('quickadd-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderQASwatches() {
    const container = document.getElementById('qa-swatches');
    container.innerHTML = qaModel.variants.map(v => `
      <button class="quickadd-swatch${qaSelectedVariants.includes(v.code) ? ' selected' : ''}"
        style="background:${v.color}"
        title="${v.name}"
        onclick="toggleQAVariant('${v.code}', '${`images/${qaModel.id}/${qaModel.images?.[v.code] || v.code + '.png'}`}')">
        <span class="swatch-check">✓</span>
      </button>`).join('');
  }

  function renderQAPlacements() {
    const container = document.getElementById('qa-placements');
    container.innerHTML = qaModel.positions.map(p => `
      <button class="quickadd-place${qaSelectedPositions.includes(p.code) ? ' selected' : ''}"
        onclick="toggleQAPosition('${p.code}')">
        ${p.name}
      </button>`).join('');
  }

  function toggleQAVariant(code, imgSrc) {
    const idx = qaSelectedVariants.indexOf(code);
    if (idx >= 0) qaSelectedVariants.splice(idx, 1);
    else { qaSelectedVariants.push(code); document.getElementById('qa-preview').src = imgSrc; }
    renderQASwatches();
    updateQABtn();
  }

  function toggleQAPosition(code) {
    const idx = qaSelectedPositions.indexOf(code);
    if (idx >= 0) qaSelectedPositions.splice(idx, 1);
    else qaSelectedPositions.push(code);
    renderQAPlacements();
    updateQABtn();
  }

  function qaSelectAll(type) {
    if (type === 'variants') {
      qaSelectedVariants = qaModel.variants.map(v => v.code);
      document.getElementById('qa-preview').src = `images/${qaModel.id}/${qaModel.variants[0].code}.png`;
      renderQASwatches();
    } else {
      qaSelectedPositions = qaModel.positions.map(p => p.code);
      renderQAPlacements();
    }
    updateQABtn();
  }

  function updateQABtn() {
    const btn = document.getElementById('qa-add-btn');
    const canAdd = qaSelectedVariants.length > 0 && qaSelectedPositions.length > 0;
    btn.disabled = !canAdd;
    btn.textContent = canAdd
      ? `Add to pack (${qaSelectedVariants.length} color${qaSelectedVariants.length !== 1 ? 's' : ''}, ${qaSelectedPositions.length} placement${qaSelectedPositions.length !== 1 ? 's' : ''})`
      : 'Select colors & placements';
  }

  function doQuickAdd() {
    if (!qaModel || qaSelectedVariants.length === 0 || qaSelectedPositions.length === 0) return;
    addToPack(qaModel.id, [...qaSelectedVariants], [...qaSelectedPositions]);
    document.getElementById('quickadd-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Close on Escape key
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { document.getElementById('quickadd-overlay').classList.remove('open'); document.body.style.overflow = ''; }
  });

  document.getElementById('search-input').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderGrid(); });
  document.getElementById('clear-filters').addEventListener('click', clearAllFilters);

  buildFilters();
  renderGrid();
</script>
</body>
</html>
